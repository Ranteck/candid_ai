[project]
name = "estudio_proyecto"
version = "0.1.0"
description = "estudio-proyecto using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.76.9,<1.0.0"
]

[project.scripts]
estudio_proyecto = "estudio_proyecto.main:run"
run_crew = "estudio_proyecto.main:run"
train = "estudio_proyecto.main:train"
replay = "estudio_proyecto.main:replay"
test = "estudio_proyecto.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
