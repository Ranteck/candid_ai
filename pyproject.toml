[project]
name = "candid-ai"
version = "0.1.0"
description = "candid-ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.76.9,<1.0.0"
]

[project.scripts]
candid-ai = "candid_ai.main:run"
run_crew = "candid_ai.main:run"
train = "candid_ai.main:train"
replay = "candid_ai.main:replay"
test = "candid_ai.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candid_ai"]
